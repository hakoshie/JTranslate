name: Desktop builds
on:
  push:
    branches: [main, "dot/jtranslate-desktop-builds", "release/v*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Avoid an OpenSSL SONAME collision between Python and an sdist-built cryptography.
      - run: python -m pip install --only-binary=cryptography -r requirements-dev.txt "pyinstaller>=6.15,<7"
      - name: Windows unit tests
        if: runner.os == 'Windows'
        run: python -m pytest -q
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --windowed --name JTranslate --icon assets/jtranslate-d-yaku.ico --add-data "assets:assets" --add-data "jtranslate_app/read-selection.ps1:jtranslate_app" --hidden-import pystray._win32 translate.pyw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/JTranslate/_internal/jtranslate_app/read-selection.ps1)) { throw "Missing selection helper" }
          $process = Start-Process dist/JTranslate/JTranslate.exe -ArgumentList '--help' -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          Compress-Archive -Path dist/JTranslate -DestinationPath JTranslate-${{ matrix.target }}.zip
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --windowed --name JTranslate --osx-bundle-identifier jp.hakoshie.jtranslate --icon assets/jtranslate-d-yaku.png --add-data "assets:assets" --hidden-import keyring.backends.macOS translate.pyw
          plutil -insert LSUIElement -bool YES dist/JTranslate.app/Contents/Info.plist
          codesign --force --sign - dist/JTranslate.app
          codesign --verify --strict dist/JTranslate.app
          dist/JTranslate.app/Contents/MacOS/JTranslate --help
          ditto -c -k --sequesterRsrc --keepParent dist/JTranslate.app JTranslate-${{ matrix.target }}.zip
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: JTranslate-${{ matrix.target }}
          path: JTranslate-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    needs: desktop
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#release/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version like v0.1.0, got $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: JTranslate-*
          merge-multiple: true
          path: release-assets
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          assets=(
            release-assets/JTranslate-windows-x64.zip
            release-assets/JTranslate-macos-arm64.zip
            release-assets/JTranslate-macos-x64.zip
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
            unzip -tq "$asset"
          done
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            if tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null)"; then
              if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
                echo "Tag $TAG exists at a different commit; refusing to overwrite" >&2
                exit 1
              fi
            else
              gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
            fi
          fi
          gh release create "$TAG" --verify-tag --title "JTranslate $TAG" --generate-notes \
            --notes "Windows x64 and macOS (Apple Silicon / Intel) builds. Extract the ZIP for your platform. macOS apps are ad-hoc signed, not notarized. Start normally for tray/menu-bar mode or use --no-resident for manual translation." \
            "${assets[@]}"
